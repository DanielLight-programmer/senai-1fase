<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassino da dona bete - Dados sortidos </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Cassino Bete: Teste de Dados</h1>

        <div class="painel-pontos">
            <h2> Pontuação Total Acumulada </h2>
            <div class="Total-pontos" id="Total-pontos">0</div>
        </div>
        <div class="zona-dados">
            <button class="btn-dado" onclick="rolarDado(4)">
                D4
                <span id="qtd-4">0 rolagens</span>
            </button>
            <button class="btn-dado" onclick="rolarDado(6)">
            </button>
            D6
            <span id="qtd-4">0 rolagens</span>
            <button class="btn-dado" onclick="rolarDado(8)">
            </button>
            D8
            <span id="qtd-4">0 rolagens</span>
            <button class="btn-dado" onclick="rolarDado(10)">
            </button>
            D10
            <span id="qtd-4">0 rolagens</span>
            <button class="btn-dado" onclick="rolarDado(12)">
            </button>
            D12
            <span id="qtd-4">0 rolagens</span>
            </button>
            <button class="btn-dado" onclick="rolarDado(20)">
                D20
                <span id="qtd-4">0 rolagens</span>
            </button>
        </div>

        <button class="btn-reset" onclick="resetarJogo()">Zerar sistema (Reset)</button>

        <div class=" grid-bonus">
            <div class="col-bonus">
                <h3> Histórico de rolagens</h3>
                <ul class="Histórico-lista" id="lista-Histórico">
                    <li class="historico-vazio">Nenhum dado rolado ainda.</li>
                </ul>
                <div class="col-bonus">
                    <h3> Último Resultado</h3>
                    <div id="ultimoResultado" class="painel-ultimo-resultado"></div>
                    Clique em um dado!

                </div>

            </div>

        </div>

    </div>
<script src="./script.js"></script>
</body>

</html>
